// ============================================================================
// TRIPLET TRIAL GENERATION
// ============================================================================

const shuffle = (a) => jsPsych.randomization.shuffle(a);

// Role of a choice image relative to the target, from the stimulus grid
function roleOf(target, choice) {
    const t = ITEM_INFO[target], c = ITEM_INFO[choice];
    if (target === choice) return 'identical';
    if (t.semantic === c.semantic) return 'semantic';
    if (t.visual === c.visual) return 'visual';
    return 'unrelated';
}

// Put the two choices in a random left/right order
function makeTrial(type, id, target, a, b) {
    const [c1, c2] = Math.random() < 0.5 ? [a, b] : [b, a];
    return {
        triplet_type: type, trial_id: id, stimulus: target, choice1: c1, choice2: c2,
        choice1_role: roleOf(target, c1), choice2_role: roleOf(target, c2)
    };
}

function createTrialSequence(design) {
    const names = ITEMS.map(i => i.image_name);

    const fixed = design.fixed_trials.map(t => makeTrial(t.type, t.id, t.target, t.a, t.b));

    const random = [];
    for (let i = 0; i < CONFIG.numRandomTrials; i++) {
        const [t, a, b] = jsPsych.randomization.sampleWithoutReplacement(names, 3);
        random.push(makeTrial('random', `R${i + 1}`, t, a, b));
    }

    const checks = [];
    for (let i = 0; i < CONFIG.numCheckTrials; i++) {
        const [t, other] = jsPsych.randomization.sampleWithoutReplacement(names, 2);
        checks.push(makeTrial('check', `C${i + 1}`, t, t, other));
    }

    let seq = shuffle(fixed.concat(random, checks));

    // Repeats: conflict trials from the first half are shown again in the second half
    const half = Math.floor(seq.length / 2);
    const firstHalfConflict = seq.slice(0, half).filter(t => t.triplet_type === 'conflict');
    const toRepeat = jsPsych.randomization.sampleWithoutReplacement(
        firstHalfConflict, Math.min(CONFIG.numRepeatTrials, firstHalfConflict.length));
    const secondHalf = seq.slice(half);
    toRepeat.forEach(t => {
        const a = t.choice1, b = t.choice2;
        const rep = makeTrial('repeat', t.trial_id, t.stimulus, a, b);
        const pos = Math.floor(Math.random() * (secondHalf.length + 1));
        secondHalf.splice(pos, 0, rep);
    });
    seq = seq.slice(0, half).concat(secondHalf);
    seq.forEach((t, i) => { t.triplet_index = i + 1; });
    return seq;
}

function autTrial(object) {
    const seconds = TEST_MODE ? 3 : CONFIG.autSeconds;
    let interval = null;
    return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<p>List as many creative, unusual uses as you can for a:</p>

        choices: "NO_KEYS",
        trial_duration: seconds * 1000,
        data: { task: 'aut', aut_object: object },
        on_load: function() {
            autText = '';
            const box = document.getElementById('aut-box');
            const timer = document.getElementById('aut-timer');
            const end = performance.now() + seconds * 1000;
            const tick = () => {
                const s = Math.max(0, Math.ceil((end - performance.now()) / 1000));
                timer.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
            };
            tick();
            interval = setInterval(tick, 250);
            box.addEventListener('input', () => { autText = box.value; });
            box.focus();
        },
        on_finish: function(data) {
            clearInterval(interval);
            // uses separated by " | " so the response stays on one CSV line
            data.aut_response = autText.split(/\n+/).map(s => s.trim()).filter(s => s.length > 0).join(' | ');

    };
}

// Collected questionnaire answers (1-indexed ratings), written to one summary row at the end
const Q = { vviq: {}, irq: {}, sscs: {} };

function likertPage(scale, items, labels, preamble) {
    // items: [{id, prompt}]; ratings are stored 1..labels.length under Q[scale][id]
    return {
        type: jsPsychSurveyLikert,
        preamble: preamble || '',
        questions: items.map(it => ({ prompt: it.prompt, labels: labels, required: true, name: `${scale}_${it.id}` })),
        randomize_question_order: false,
        scale_width: 760,
        data: { task: scale, item_order: items.map(it => it.id).join('|') },
        on_finish: function(data) {
            for (const [name, value] of Object.entries(data.response)) {
                Q[scale][name.replace(`${scale}_`, '')] = value + 1;
            }
        }
    };
}

    "I don't see words in my 'mind's eye' when I think",
    "When I am introduced to someone for the first time, I imagine what their name would look like when written down",
    "A strategy I use to help me remember written material is imagining what the writing looks like",
    "I hear a running summary of everything I am doing in my head",
    "I rehearse in my mind how someone might respond to a text message before I send it",
    "I can easily imagine and mentally rotate three-dimensional geometric figures",
    "It is hard for me to imagine this sentence in my mind pronounced unnaturally slowly",
    "In school, I had no problems with geometry",
    "It is easy for me to imagine the sensation of licking a brick",
    "I find it difficult to imagine how a three-dimensional geometric figure would exactly look like when rotated",
    "I can easily imagine someone clearly talking, and then imagine the same voice with a heavy cold",
    "I think I have a large vocabulary in my native language compared to other people",
    "I can easily imagine the sound of a trumpet getting louder"
];

const irq_instructions = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="left-text" style="max-width:700px;">
        <p>Next are some statements about the ways people think.</p>
        <p>Please indicate how much you agree or disagree with each statement as a description of you.</p>
    </div>`,
    choices: ["Continue"],
    post_trial_gap: 500
};

function irqPages() {
    // items in random order (as in the earlier imagery study), plus one attention-check item
    let items = IRQ_ITEMS.map((prompt, i) => ({ id: i + 1, prompt: prompt }));
    items.push({ id: 'catch', prompt: "Select 'Disagree' for this statement" });
    items = shuffle(items);
    const pages = [];
    for (let i = 0; i < items.length; i += 10) {
        pages.push(likertPage('irq', items.slice(i, i + 10), AGREE_SCALE));
    }
    return pages;
}

// --- Short Scale of Creative Self (Karwowski, 2012): creative self-efficacy (3,4,5,6,8,9)
//     and creative personal identity (1,2,7,10,11) ---
const SSCS_SCALE = ["Definitely not", "Somewhat not", "Neither yes nor no", "Somewhat yes", "Definitely yes"];
const SSCS_ITEMS = [
    "I think I am a creative person",
    "My creativity is important for who I am",
    "I know I can efficiently solve even complicated problems",
    "I trust my creative abilities",
    "My imagination and ingenuity distinguishes me from my friends",
    "Many times I have proved that I can cope with difficult situations",
    "Being a creative person is important to me",
    "I am sure I can deal with problems requiring creative thinking",
    "I am good at proposing original solutions to problems",
    "Creativity is an important part of myself",
    "Ingenuity is a characteristic that is important to me"
];

const sscs = likertPage('sscs',
    SSCS_ITEMS.map((prompt, i) => ({ id: i + 1, prompt: prompt })),
    SSCS_SCALE,
    `<p style="max-width:760px; margin:auto;">Finally, please decide to what extent each of the statements below describes you.</p>`);

// One row holding all questionnaire answers in fixed item order (pipe-delimited, 1-indexed;
// "vviq" matches the column convention in filtereddata_perception_Exp2.csv)
const summary = {
    type: jsPsychCallFunction,
    func: function() {},
    data: { task: 'summary' },
    on_finish: function(data) {
        const ordered = (obj, n) => Array.from({ length: n }, (_, i) => obj[i + 1] ?? '').join('|');
        data.vviq = ordered(Q.vviq, 16);
        data.irq = ordered(Q.irq, 36);
        data.irq_catch = Q.irq['catch'] ?? '';
        data.sscs = ordered(Q.sscs, 11);
        const trip = jsPsych.data.get().filter({ task: 'triplet' });
        data.n_triplets = trip.count();
        data.n_checks_correct = trip.filter({ triplet_type: 'check', correct: true }).count();
        data.total_minutes = Math.round(jsPsych.getTotalTime() / 6000) / 10;
    }
};

// ============================================================================
// MAIN EXECUTION
// ============================================================================

async function initializeExperiment() {
    let design;
    try {
        design = await (await fetch(CONFIG.designFile)).json();
    } catch (error) {
        console.error('Error loading design:', error);
        alert('Failed to load the experiment design (' + CONFIG.designFile + ').');
        return;
    }
    ITEMS = design.items;
    ITEMS.forEach(it => { ITEM_INFO[it.image_name] = it; });
    console.log(`Loaded ${ITEMS.length} images and ${design.fixed_trials.length} fixed trials`);

    const allTrials = createTrialSequence(design);
    n_main_trials = allTrials.length;

    timeline.push({
        type: jsPsychPreload,
        images: ITEMS.map(it => CONFIG.imageDirectory + it.image_name),
        message: '<p>Loading, please wait...</p>'
    });
    timeline.push(welcome);
    timeline.push(fullscreen);
    timeline.push(consent);
    timeline.push(overview);

    // Part 1: creativity
    timeline.push(dat);
    timeline.push(aut_instructions);
    CONFIG.autObjects.forEach((obj, i) => {
        timeline.push(autTrial(obj));
        if (i < CONFIG.autObjects.length - 1) {
            timeline.push({
                type: jsPsychHtmlButtonResponse,
                stimulus: "<p>Time is up for that object.</p><p>Click below when you are ready for the next one.</p>",
                choices: ["Next object"]
            });
        }
    });
    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: "<p>Time is up. Nice work!</p><p>Next is the picture task.</p>",
        choices: ["Continue"]
    });

    // Part 2: triplets, in blocks with breaks
    timeline.push(triplet_instructions);
    const chunkSize = Math.ceil(allTrials.length / CONFIG.numBlocks);
    for (let i = 0; i < allTrials.length; i += chunkSize) {
        timeline.push(Object.assign({}, mainProcedure, { timeline_variables: allTrials.slice(i, i + chunkSize) }));
        if (i + chunkSize < allTrials.length) timeline.push(breakTrial);
    }
    timeline.push(strategy);
    if (!TEST_MODE) timeline.push(saveData('partial'));   // safety copy before the questionnaires

    // Part 3: questionnaires
    timeline.push(questionnaire_instructions);
    timeline.push(vviq_instructions);
    vviq_pages.forEach(p => timeline.push(p));
    timeline.push(irq_instructions);
    irqPages().forEach(p => timeline.push(p));
    timeline.push(sscs);
    timeline.push(demographic_instructions);
    timeline.push(demographics);
    timeline.push(id_age);
    timeline.push(vision);
    timeline.push(summary);
    if (!TEST_MODE) timeline.push(saveData(''));
    timeline.push(goodbye);

    jsPsych.run(timeline);
}

initializeExperiment();
